<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #9ca3af;
      letter-spacing: 6px;
    }
    .gear {
      transform-origin: center;
      animation: rotate 20s linear infinite;
    }
    .gear-reverse {
      transform-origin: center;
      animation: rotate-back 25s linear infinite;
    }
    .pulse {
      animation: pulse-glow 3s ease-in-out infinite alternate;
    }
    .float-item {
      animation: float-y 6s ease-in-out infinite alternate;
    }
    .grid-line {
      stroke: #1f2937;
      stroke-width: 1;
      opacity: 0.4;
    }
    .dash-line {
      stroke: #06b6d4;
      stroke-width: 1.5;
      stroke-dasharray: 8 8;
      animation: dash-move 30s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate-back {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulse-glow {
      0% { opacity: 0.3; filter: drop-shadow(0 0 2px #06b6d4); }
      100% { opacity: 0.9; filter: drop-shadow(0 0 12px #06b6d4); }
    }
    @keyframes float-y {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes dash-move {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Animated Grid / Tech lines -->
  <g>
    <!-- Horizontal grid lines -->
    <line x1="0" y1="50" x2="1200" y2="50" class="grid-line" />
    <line x1="0" y1="100" x2="1200" y2="100" class="grid-line" />
    <line x1="0" y1="150" x2="1200" y2="150" class="grid-line" />
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line" />
    <line x1="0" y1="250" x2="1200" y2="250" class="grid-line" />
    
    <!-- Vertical grid lines -->
    <line x1="150" y1="0" x2="150" y2="300" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="300" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="300" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="300" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="300" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="300" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="300" class="grid-line" />
  </g>

  <!-- Flowing Connection Path -->
  <path d="M-50,150 Q150,100 300,180 T600,120 T900,180 T1250,150" fill="none" class="dash-line" />
  <path d="M-50,160 Q200,220 400,100 T800,170 T1250,140" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3" />

  <!-- Abstract Facility / Building Geometry on the right -->
  <g transform="translate(900, 40)" class="float-item">
    <!-- Building 1 -->
    <rect x="50" y="80" width="60" height="140" fill="#1e293b" rx="4" stroke="#475569" stroke-width="1" />
    <line x1="65" y1="100" x2="95" y2="100" stroke="#334155" stroke-width="2" />
    <line x1="65" y1="120" x2="95" y2="120" stroke="#334155" stroke-width="2" />
    <line x1="65" y1="140" x2="95" y2="140" stroke="#334155" stroke-width="2" />
    <line x1="65" y1="160" x2="95" y2="160" stroke="#334155" stroke-width="2" />
    <line x1="65" y1="180" x2="95" y2="180" stroke="#334155" stroke-width="2" />

    <!-- Building 2 (Main Tower) -->
    <rect x="130" y="40" width="70" height="180" fill="#1e293b" rx="4" stroke="url(#accent-cyan)" stroke-width="1.5" />
    <!-- Glowing windows -->
    <circle cx="150" cy="70" r="3" fill="#06b6d4" class="pulse" />
    <circle cx="180" cy="70" r="3" fill="#06b6d4" class="pulse" />
    <circle cx="150" cy="100" r="3" fill="#06b6d4" />
    <circle cx="180" cy="100" r="3" fill="#10b981" />
    <circle cx="150" cy="130" r="3" fill="#10b981" />
    <circle cx="180" cy="130" r="3" fill="#06b6d4" />
    <circle cx="150" cy="160" r="3" fill="#06b6d4" />
    <circle cx="180" cy="160" r="3" fill="#06b6d4" />

    <!-- Building 3 -->
    <rect x="220" y="110" width="50" height="110" fill="#1e293b" rx="4" stroke="#475569" stroke-width="1" />
    <line x1="235" y1="130" x2="255" y2="130" stroke="#334155" stroke-width="2" />
    <line x1="235" y1="150" x2="255" y2="150" stroke="#334155" stroke-width="2" />
    <line x1="235" y1="170" x2="255" y2="170" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Mechanical / CMMS Elements (Gears) on the left -->
  <g transform="translate(160, 150)">
    <!-- Gear 1 (Cyan) -->
    <g class="gear" transform="scale(1.2)">
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#accent-cyan)" stroke-width="6" />
      <circle cx="0" cy="0" r="12" fill="none" stroke="#06b6d4" stroke-width="2" />
      <!-- Teeth -->
      <rect x="-6" y="-38" width="12" height="10" fill="#06b6d4" rx="2" />
      <rect x="-6" y="28" width="12" height="10" fill="#06b6d4" rx="2" />
      <rect x="-38" y="-6" width="10" height="12" fill="#06b6d4" rx="2" />
      <rect x="28" y="-6" width="10" height="12" fill="#06b6d4" rx="2" />
      <path d="M-22,-22 L-29,-29" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />
      <path d="M22,22 L29,29" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />
      <path d="M-22,22 L-29,29" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />
      <path d="M22,-22 L29,-29" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- Gear 2 (Green) -->
    <g transform="translate(56, 42) scale(0.8)" class="gear-reverse">
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#accent-green)" stroke-width="6" />
      <circle cx="0" cy="0" r="12" fill="none" stroke="#10b981" stroke-width="2" />
      <!-- Teeth -->
      <rect x="-6" y="-38" width="12" height="10" fill="#10b981" rx="2" />
      <rect x="-6" y="28" width="12" height="10" fill="#10b981" rx="2" />
      <rect x="-38" y="-6" width="10" height="12" fill="#10b981" rx="2" />
      <rect x="28" y="-6" width="10" height="12" fill="#10b981" rx="2" />
    </g>
  </g>

  <!-- Glowing Nodes/Sensors (IoT Aspect) -->
  <circle cx="300" cy="180" r="6" fill="#06b6d4" class="pulse" filter="url(#glow)" />
  <circle cx="600" cy="120" r="6" fill="#10b981" class="pulse" filter="url(#glow)" />
  <circle cx="900" cy="180" r="6" fill="#06b6d4" class="pulse" filter="url(#glow)" />

  <!-- Decorative Overlay Glow -->
  <circle cx="0" cy="150" r="150" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />
  <circle cx="1200" cy="150" r="200" fill="#10b981" opacity="0.05" filter="url(#glow)" />

  <!-- Center Text -->
  <g transform="translate(320, 140)">
    <text x="0" y="0" class="title">AWESOME CMMS &amp; FM</text>
    <text x="5" y="40" class="subtitle">FACILITIES MANAGEMENT &amp; ASSET TRACKING</text>
  </g>

</svg>
