<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      
      @keyframes float-slow {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }

      .animated-wave { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
      .floating-card { animation: float-slow 5s ease-in-out infinite; }
      .flowing-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/>

  <!-- Animated Grid / Background Elements -->
  <g opacity="0.15">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 100,0 L 100,350 M 200,0 L 200,350 M 300,0 L 300,350 M 400,0 L 400,350 M 500,0 L 500,350 M 600,0 L 600,350 M 700,0 L 700,350 M 800,0 L 800,350 M 900,0 L 900,350 M 1000,0 L 1000,350 M 1100,0 L 1100,350" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Dynamic Animated Graphic Elements (Positioned safely behind/around text) -->
  <g class="animated-wave" opacity="0.4">
    <circle cx="1000" cy="175" r="140" fill="none" stroke="url(#accent-grad)" stroke-width="2"/>
    <circle cx="1000" cy="175" r="100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6, 6"/>
  </g>

  <!-- Decorative Tech Graphic (Right Side) -->
  <g class="floating-card" transform="translate(880, 75)">
    <rect width="240" height="200" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Building / FM Icon Abstract -->
    <rect x="30" y="40" width="45" height="120" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="85" y="70" width="45" height="90" rx="4" fill="#818cf8" opacity="0.8"/>
    <rect x="140" y="20" width="65" height="140" rx="4" fill="#c084fc" opacity="0.8"/>

    <!-- Chart line -->
    <path d="M 20,150 L 70,120 L 120,130 L 190,60" fill="none" stroke="#38bdf8" stroke-width="3" class="flowing-line"/>
    <circle cx="190" cy="60" r="5" fill="#38bdf8"/>
  </g>

  <!-- Main Title & Header Content (Always Foreground) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 55)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="140" y="21" text-anchor="middle" class="badge-text">🏢 CAFM / IWMS / CMMS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Facilities Management 🏢⚡</text>

    <!-- Bottom Gradient Accent Bar -->
    <rect x="0" y="165" width="520" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="210" class="subtitle">Curated SaaS Platforms, Open-Source Tools &amp; Smart Building Solutions</text>

    <!-- Stat/Category Tags -->
    <g transform="translate(0, 245)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="30" rx="6" fill="#334155" opacity="0.7"/>
      <text x="65" y="19" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">💼 Top SaaS</text>

      <!-- Tag 2 -->
      <rect x="140" y="0" width="160" height="30" rx="6" fill="#334155" opacity="0.7"/>
      <text x="220" y="19" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">⭐ Open Source</text>

      <!-- Tag 3 -->
      <rect x="310" y="0" width="180" height="30" rx="6" fill="#334155" opacity="0.7"/>
      <text x="400" y="19" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">📊 Market Valuation</text>
    </g>
  </g>
</svg>
